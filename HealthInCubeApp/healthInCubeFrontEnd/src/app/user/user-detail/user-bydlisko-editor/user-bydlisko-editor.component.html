<div class="row">
    <div class="col-md-12">
        <form (ngSubmit)="onSubmit(editForm)" #editForm="ngForm">
            <div class="row">
                <div class="col-sm-5 form-group">
                    <label for="ulica">Ulica</label>
                    <input 
                        type="text" 
                        id="ulica" 
                        class="form-control" 
                        name="ulica"
                        ngModel
                        required
                        >
                </div>

                <div class="col-sm-4 form-group" *ngIf="editMode; else selectCity">
                    <label for="mesto">Mesto</label>
                    <input 
                        type="text" 
                        id="mesto" 
                        class="form-control" 
                        name="mesto"
                        ngModel
                        required
                        >
                </div>

                <ng-template #selectCity>
                    <!-- <select class="custom-select d-block w-100" id="city" (ngModelChange)="onChangeCity()">
                        <option [disabled]="true" [selected]="true" value="">Choose...</option>
                        <option [ngValue]="mesto.idMesto" *ngFor="let mesto of mesta">{{mesto.nazov}}</option>
                    </select> -->
                </ng-template>

                <div class="col-sm-2 form-group">
                    <label for="idMesto">Id</label>
                    <input 
                        type="number" 
                        id="idMesto" 
                        class="form-control" 
                        name="idMesto"
                        ngModel
                        [readOnly]="true"
                        >
                </div>
                <div class="col-sm-1 form-group">
                    <label for="trvale">Aktuálna</label>
                    <input 
                        type="checkbox" 
                        id="trvale" 
                        class="form-control" 
                        name="trvale"
                        ngModel
                        required
                        >
                </div>
            </div>

            <div class="row">
                <div class="col-md-12">
                    <button class="btn btn-success" type="submit" [disabled]="!editForm.valid">{{ editMode ? 'Update' : 'Add' }}</button>
                </div>
            </div>
        </form>
    </div>
</div>
