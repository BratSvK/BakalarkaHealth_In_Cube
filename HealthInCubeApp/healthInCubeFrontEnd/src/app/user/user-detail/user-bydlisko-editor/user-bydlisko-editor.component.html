<div class="row">
    <div class="col-md-12">
        <form (ngSubmit)="onSubmit(editForm)" #editForm="ngForm">
            <div class="row">
                <div class="col-sm-5 form-group">
                    <label for="ulica">Ulica</label>
                    <input type="text" id="ulica" class="form-control" name="ulica" ngModel required>
                </div>




                <div class="col-sm-4 form-group" *ngIf="(mesta$ | async) as mestaPole">
                    <label for="mesto">Mesto</label>
                    <select class="custom-select d-block w-100 text-truncate" id="city" name="mesto" ngModel>
                        <option [disabled]="true" [selected]="true" value="">Choose...</option>
                        <option [value]="mesto.nazov" *ngFor="let mesto of mestaPole">{{mesto.nazov}}</option>
                    </select>
                </div>


                <div class="col-sm-2 form-group">
                    <label for="idMesto">Id</label>
                    <input type="number" id="idMesto" class="form-control" name="idMesto" [(ngModel)]="selectedIdMesto"
                        [readOnly]="true">
                </div>
                <div class="col-sm-1 form-group">
                    <label for="trvale">Aktuálna</label>
                    <input type="checkbox" id="trvale" class="form-control" name="trvale" ngModel>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12">
                    <button class="btn btn-success" type="submit" [disabled]="!editForm.valid">{{ editMode ?
                        'Aktualizuj' :
                        'Pridaj' }}</button>
                    <button class="btn btn-primary" type="button" (click)="onReset()">Vyčisti</button>
                </div>
            </div>
        </form>
    </div>
</div>
