<ng-container *ngIf="user | async as user">
    <div class="card">
        <div class="row">
            <div class="col-2" *ngIf="user.fotka">
                <img [src]="user.fotka" alt="{{user.fullName}}" class="img-thumbnail p-1">
                <div class="text-center">
                    <button (click)="deletePhoto()" class="btn btn-sm btn-danger">
                        <i class="fa fa-trash"></i></button>
                </div>
            </div>
        </div>

        <div class="row mt-3">

            <div class="col-md-3">

                <h3 class="ml-3">Pridaj</h3>

                <div ng2FileDrop [ngClass]="{'nv-file-over': hasBaseDropzoneOver}" (fileOver)="fileOverBase($event)"
                    [uploader]="uploader" class="card bg-faded p-3 text-center mb-3 ml-3 my-drop-zone">
                    <i class="fa fa-upload fa-3x">
                        Vlož ma
                    </i>
                </div>
                <div class="ml-3">
                    Vyber fotku
                    <input type="file" ng2FileSelect [uploader]="uploader" />
                </div>
            </div>

            <div class="col-md-9" style="margin-bottom: 40px" *ngIf="uploader?.queue?.length">

                <h3>Načítané fotky</h3>
                <p>Počet fotiek: {{ uploader?.queue?.length }}</p>

                <table class="table">
                    <thead>
                        <tr>
                            <th width="50%">Meno</th>
                            <th>Veľkosť</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of uploader.queue">
                            <td><strong>{{ item?.file?.name }}</strong></td>
                            <td *ngIf="uploader.options.isHTML5" nowrap>{{ item?.file?.size/1024/1024 | number:'.2' }}
                                MB</td>
                            <td *ngIf="uploader.options.isHTML5">
                                <div class="progress" style="margin-bottom: 0;">
                                    <div class="progress-bar" role="progressbar"
                                        [ngStyle]="{ 'width': item.progress + '%' }"></div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div>
                    <div>
                        Stav:
                        <div class="progress" style="">
                            <div class="progress-bar" role="progressbar"
                                [ngStyle]="{ 'width': uploader.progress + '%' }"></div>
                        </div>
                    </div>
                    <button type="button" class="btn btn-success btn-s" (click)="uploader.uploadAll()"
                        [disabled]="!uploader.getNotUploadedItems().length">
                        <span class="fa fa-upload"></span> Nahraj
                    </button>
                    <button type="button" class="btn btn-warning btn-s" (click)="uploader.cancelAll()"
                        [disabled]="!uploader.isUploading">
                        <span class="fa fa-ban"></span> Zruš
                    </button>
                    <button type="button" class="btn btn-danger btn-s" (click)="uploader.clearQueue()"
                        [disabled]="!uploader.queue.length">
                        <span class="fa fa-trash"></span> Vymaž
                    </button>
                </div>

            </div>

        </div>
    </div>
</ng-container>
