<div class="row" *ngIf="user">
    <div class="col-4">
        <h2>Tvoj profil</h2>
    </div>
    <div class="col-8">
        <div class="alert alert-info" *ngIf="editForm.dirty">
            <strong>Informácia: </strong> Spravil si zmeny. Všetko neuložené sa zmaže.
        </div>
    </div>
    <div class="col-4">
        <div class="card" *ngIf="(userAuth$ | async) as userAuth">
            <img [src]="userAuth.fotka || '../../../assets/user.png'" alt="{{userAuth.fullName}}"
                class="card-img-top img-thumbnail">
            <div class="card-body">
                <div>
                    <strong>Poloha:</strong>
                    <p>{{getLivingCity(user.bydliskos)}}
                </div>
                <div>
                    <strong>Vek:</strong>
                    <p>{{getAgeByBirthDate(user.datNarodenia)}}</p>
                </div>
                <div>
                    <strong>Posledne prihlasenie:</strong>
                    <p>{{user.poslednePrihlasenie | timeago}}</p>
                </div>
                <div>
                    <strong>Pacient od:</strong>
                    <p>{{user.registrovany | date}}</p>
                </div>
            </div>
            <div class="card-footer">
                <button [disabled]="!editForm.dirty" form="editForm" type="submit" class="btn btn-success btn-block">Save Changes</button>
            </div>
        </div>
    </div>

    <div class="col-8">
        <tabset class="member-tabset">
            <tab heading='Informácie'>
                <form #editForm="ngForm" id="editForm">
                   
                </form>
            </tab>
            <tab heading='Fotka'>
                <app-photo-editor [user]="user"></app-photo-editor>
            </tab>
        </tabset>
    </div>
</div>
