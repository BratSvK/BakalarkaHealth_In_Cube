<table class="table table-striped table-dark">
    <thead >
      <th >Patien name</th>
      <th style="text-align: center;">Request date</th>
      <th style="text-align: center;">Approve</th>
    </thead>
    <tbody>
      <tr *ngFor="let req of requests">
        <td>{{req.FullName}}</td>
        <td>{{req.Date}}</td>
        <td ><button class="btn btn-primary"></button></td>
      </tr>
    </tbody>
  </table>
