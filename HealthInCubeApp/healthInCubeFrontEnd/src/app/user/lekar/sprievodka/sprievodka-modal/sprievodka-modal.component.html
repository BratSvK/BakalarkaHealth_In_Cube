<div class="modal-header">
  <h4 class="modal-title pull-left">
    {{sprievodkaHeaderText}}
  </h4>
  <button type="button" 
          class="btn-close close pull-right" 
          aria-label="Close" 
          (click)="bsModalRef.hide()">
    <span aria-hidden="true" 
          class="visually-hidden">&times;</span>
  </button>
</div>
<div class="modal-body">
  <form [formGroup]="sprievodkaForm" 
        autocomplete="off" 
        bg-light 
        (ngSubmit)="createSprievodka()">

    <div class="form-row">
      <div class="col-md-6 mb-3">
        <label for="BID">
          Pacient rodné číslo
        </label>
        <input type="text" 
               class="form-control" 
               id="BID" 
               placeholder="etc. 981124/4168" 
               formControlName="birthIDNumber">
      </div>
      <div class="col-md-6 mb-3">
        <label for="patientName">
          Pacient
        </label>
        <input type="text" 
               class="form-control" 
               id="patientName" 
               formControlName="patientName" 
               disabled>
      </div>
    </div>
    <div class="form-row">
      <div class="col-md-10 mb-3">
        <label for="idTypVysetrenia">
          Typ vyšetrenia
        </label>
        <select class="custom-select d-block w-100" 
                id="idTypVysetrenia" 
                formControlName="idTypVysetrenia">
          <option [disabled]="true" 
                  [selected]="true" 
                  value="">Choose...
          </option>
          <option [ngValue]="typeDoc.id" 
                  *ngFor="let typeDoc of typeOfDoctors">
                  {{typeDoc.nazov}}
          </option>
        </select>
      </div>
      <div class="col-md-2 mb-3">
        <button type="button" 
                class="btn info" 
                [tooltip]="infoVysetrenie" 
                placement="right">
        <fa-icon class="ml-3" 
                 [icon]="infoTooltip">
        </fa-icon>
        </button>
      </div>
    </div>
    <div class="form-row">
      <div class="col-md-12 mb-3">
        <label for="lekarName">
          Lekár
        </label>
        <input type="text" 
               class="form-control" 
               id="lekarName" 
               formControlName="lekarName" 
               disabled>
      </div>
    </div>
    <div class="form-row">
      <div class="col-md-12 mb-3">
        <label for="terminDatum">
          Termín
        </label>
        <input type="text" 
               class="form-control" 
               id="terminDatum" 
               formControlName="terminDatum"
               placeholder="Vyber si deň" 
               [bsConfig]="{containerClass: 'theme-blue'}"
               bsDatepicker
               placement="right">
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" 
              class="btn btn-default" 
              (click)="closeSprievodkaForm()">
              Zavrieť
      </button>
      <button type="button" 
              class="btn btn-primary" 
              (click)="createSprievodka()">
              Vytvoriť
      </button>
    </div>
