<div class="text-center mt-3">
    <h3>Počet pacientov - {{pagination?.totalItems}} nájdení</h3>
</div>

<div class="container mt-3">
    <form #filter="ngForm" class="mb-3" autocomplete="off">
        <div class="form-row justify-content-center">


            <div class="form-group col-md-2">
                <label>Rodné číslo: </label>
                <input type="text" class="form-control ml-1" name="bid" placeholder="000000/0000" [(ngModel)]="lekarParams.bid">
            </div>

            <div class="form-group col-md-4 px-2">
                <label>Priezvisko: </label>
                <input type="text" class="form-control ml-1" name="lastName" [(ngModel)]="lekarParams.lastName">
            </div>

            <div class="form-group px-2">
                <label>Vek od: </label>
                <input type="number" class="form-control ml-1" style="width: 70px;" name="ageFrom"
                    [(ngModel)]="lekarParams.ageFrom">
            </div>

            <div class="form-group px-2">
                <label>Vek do: </label>
                <input type="number" class="form-control ml-1" style="width: 70px;" name="ageTo"
                    [(ngModel)]="lekarParams.ageTo">
            </div>
        </div>

        <div class="form-row justify-content-center">
            <button class="btn btn-primary ml-1" type="button" (click)="loadPatients()">Filtrovať</button>
            <button class="btn btn-info ml-1" (click)="resetFilter()">Vyčistiť filter</button>
        </div>

    </form>
</div>

<div class="row">
    <div class="col-2" *ngFor="let pacient of patients">
        <app-pacient-card [patient]="pacient"></app-pacient-card>
    </div>
</div>

<div class="d-flex justify-content-center" *ngIf="pagination?.totalItems > 0">
    <pagination [boundaryLinks]="true" [totalItems]="pagination.totalItems" [itemsPerPage]="pagination.itemsPerPage"
        [(ngModel)]="pagination.currentPage" (pageChanged)="pageChanged($event)" previousText="&lsaquo;"
        nextText="&rsaquo;" firstText="&laquo;" lastText="&raquo;">
    </pagination>
</div>
