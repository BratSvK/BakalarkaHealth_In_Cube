<div class="card mb-4">
    <div class="card-image-wrapper">
        <img src="{{patient.fotka || './assets/user.png'}}" alt="{{patient.fullName}}" class="card-img-top">
        <ul class="list-inline member-icons animate text-center">
            <li class="list-inline-item"><button class="btn btn-primary" routerLink='/members/{{patient.idPacient}}'><i class="fa fa-user"></i></button></li>
        </ul>
    </div>
    <div class="card-body p-1">
        <h6 class="card-title text-center mb-1">
            <i class="fa fa-user mr-2"></i>
            {{patient.fullName}}
        </h6>
        <p class="card-text text-monospace text-center mb-1">{{patient.datNarodenia | date}}</p>
        <p class="card-text text-muted text-center">{{patient.mestoNarodenia}}</p>
    </div>
</div>
