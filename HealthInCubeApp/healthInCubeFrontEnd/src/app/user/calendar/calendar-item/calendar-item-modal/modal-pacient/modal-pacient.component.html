<ng-container *ngIf="sprievodka">
       <div class="modal-header">
         <h4 class="modal-title pull-left">
           {{title}}
         </h4>
         <button type="button" 
                 class="btn-close close pull-right" 
                 aria-label="Close" 
                 (click)="bsModalRef.hide()">
           <span aria-hidden="true" 
                 class="visually-hidden">&times;</span>
         </button>
       </div>
        <div class="modal-body">
         <form autocomplete="off" 
               bg-light >
     
           <div class="form-row">
             <div class="col-md mb-3">
               <label for="lekarName">
                 Lekar
               </label>
               <input type="text" 
                     class="form-control" 
                     id="lekarName" 
                     [ngModel]="sprievodka.idLekarNavigation?.fullName"
                     name="lekarName"
                     readonly>
             </div>
           </div>
           <div class="form-row">
               <div class="col-md mb-3">
                 <label for="vykonMiesto">
                   Miesto vyšetrenia
                 </label>
                 <input type="text" 
                       class="form-control" 
                       id="vykonMiesto" 
                       [ngModel]="sprievodka.idLekarNavigation?.pracovisko | uppercase"
                       name="vykonMiesto"
                       readonly>
               </div>
             </div>
           <div class="form-row">
             <div class="col-md-10 mb-3">
               <label for="typVysetrenia">
                 Typ vyšetrenia
               </label>
               <input type="text" 
                     class="form-control" 
                     id="typVysetrenia" 
                     [ngModel]="sprievodka.idTypLekarNavigation?.nazov"
                     name="typVysetrenia"
                     readonly>
             </div>
             <div class="col-md-2 mb-3">
               <button type="button" 
                       class="btn info" 
                       [tooltip]="sprievodka.idTypLekarNavigation.popis" 
                       placement="right">
               <fa-icon class="ml-3" 
                       [icon]="infoTooltip">
               </fa-icon>
               </button>
             </div>
           </div>
           <div class="form-row">
               <div class="col-md-6 mb-3">
                 <label for="terminOd">
                   Začiatok vyšetrenia
                 </label>
                 <input type="text" 
                       class="form-control" 
                       id="terminOd" 
                       [ngModel]="sprievodka.terminOd | date:'dd.MM.YYYY HH:mm'"
                       name="terminOd"
                       readonly>
               </div>
               <div class="col-md-6 mb-3">
                   <label for="terminDo">
                       Koniec vyšetrenia
                     </label>
                   <input type="text" 
                          class="form-control" 
                          id="terminDo" 
                          [ngModel]="sprievodka.terminDo | date:'dd.MM.YYYY HH:mm'"
                          name="terminDo"
                          readonly>
               </div>
             </div>
             <div *ngIf="!showTooltip"  
                   class="form-row">
              <div class="col-md mb-3">
                <label for="dovodZrusenia">
                  Dôvod zrušenia termínu(info pre lekára)
                </label>
                <input type="text" 
                      class="form-control" 
                      id="dovodZrusenia" 
                      [(ngModel)]="dovodZrusenia"
                      name="dovodZrusenia"
                      minlength="2"
                      maxlength="2000">
                <span>(*Vyplnte v prípade zrušenia termínu.)</span>
              </div>
            </div>
           </form>
         </div>
         <div class="modal-footer">
          <button [isAllowedDenyAppointment]="sprievodka.terminOd"
                  type="button"
                  [tooltip]="showTooltip ? denyMessage : null"
                  (showTooltip)="showValueFromEmit($event)" 
                  triggers="pointerenter:pointerout"
                  class="btn btn-danger denyApoint" 
                  (click)="denyAppointment()">
                  Zrušiť termín
          </button>
          <ng-template #denyMessage>
            Nesmieš zrušiť sprievodku 48 hod. pred začiatkom vyšetrenia.
          </ng-template>
          <button 
                  type="button" 
                  class="btn btn-default" 
                  (click)="closeSprievodkaForm()">
                  Zavrieť
          </button>
        </div>
</ng-container>
