<div *ngFor="let sprievodka of sprievodkaItems; let i = index"
    class="sprievodkaItem" 
    [ngStyle]="{'background-color': colorOfSprievodka[i]}"
    [tooltip]="scheduleTimeInfo"
    (click)="openSprievodkaItemModal(i)">
    <p class="titleOfSprievodka">
        {{getPopisSprievodka(i)}}
    </p>

<ng-template #scheduleTimeInfo>
    Začiatok o: {{sprievodkaItems[i]?.terminOd | date:'shortTime'}}
    <br>
    Trvanie: {{getDurationInMinutes(i)}} min.
</ng-template>
</div>
