<div ngAnimatedBorderWrapper>
    <span 
        ngAnimatedBorder 
        class="myCssAnimation" 
        [abBorderWidth]="['4px']" 
        [abBorderRadius]="['10px']"
        [abBackgroundColor]="'#f5f5f5'">
        <div class="modal-header">
        <fa-icon class="mr-3" 
                [icon]="iconWarning">
        </fa-icon>
            <h4 class="modal-title pull-left">
            {{caption}}
            </h4>
        </div>
            <div class="modal-body text-center">
                <p>{{message}}</p>
                <button 
                    type="button" 
                    class="btn btn-warning" 
                    (click)="acceptChanges()">
                    {{acceptButton}}
                </button>
            </div>
    </span>
</div>
