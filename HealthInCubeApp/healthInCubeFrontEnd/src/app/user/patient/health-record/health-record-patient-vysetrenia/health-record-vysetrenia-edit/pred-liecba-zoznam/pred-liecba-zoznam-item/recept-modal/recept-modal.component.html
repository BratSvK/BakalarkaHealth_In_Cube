<div *ngIf="pacientDetail">
<div class="modal-header">
    <h4 class="modal-title pull-left">
      <b>Lekársky predpis</b>
    </h4>
    <button type="button" 
            class="btn-close close pull-right" 
            aria-label="Close" 
            (click)="bsModalRef.hide()">
      <span aria-hidden="true" 
            class="visually-hidden">&times;</span>
    </button>
  </div>
   <div class="modal-body">
    <form autocomplete="off" 
          bg-light>
      <div class="form-row">
        <div class="col-md-6 mb-3">
          <label for="fullName">
            Priezvisko a meno
          </label>
          <input hasFocus="true"
                 type="text" 
                 class="form-control" 
                 id="fullName"
                 [value]="pacientDetail.fullName"
                 disabled>
        </div>
        <div class="col-md-6 mb-3">
          <label for="BID">
            Rodné číslo
          </label>
          <input type="text" 
                class="form-control" 
                id="BID"
                [value]="pacientDetail.bid"
                disabled>
        </div>
      </div>
      
       <div class="form-row">
         <div class="col-md mb-3">
            <label for="vystavil">
              Vystavil
            </label>
            <input type="text" 
            class="form-control" 
            id="vystavil"
            [value]="recept?.osetrujuciLekar"
            disabled>
          </div>
        </div>
       
        <div class="form-row">
          <div class="col-md mb-3">
             <label for="vystavil">
               Predpisaný liek
             </label>
             <app-vysetrenia-recept-liek-item [balenie]="recept.idBalenenieNavigation">
             </app-vysetrenia-recept-liek-item>
           </div>
         </div>
         <hr class="summary">
         <div class="form-row">
          <div class="col-md-6 mb-3">
            <label for="vystavilDatum">
              Vystavený
            </label>
               <input type="text" 
               class="form-control" 
               id="vystavilDatum"
               [value]="vystavenieDate"
               disabled>
          </div>
          <div class="col-md-6 mb-3">
             <label for="vybral">
               Vybratý v lekárni
             </label>
                <input type="text" 
                class="form-control" 
                id="vystavil"
                [value]="vybranieDate"
                disabled>
              </div>
         </div>

         <div class="form-row">
          <div class="col-md-6 mb-3">
            <label for="vystavil">
              Balenie(ks)
            </label>
               <input type="number" 
               class="form-control" 
               id="vystavil"
               [value]="recept?.balenieKs"
               disabled>
          </div>
          <div class="col-md-6 mb-3">
             <label for="vystavil">
               Cena
             </label>
             <div class="cena-wrapper right">
                <input type="number" 
                class="form-control" 
                id="vystavil"
                [value]="recept?.cena"
                disabled>
                <fa-icon 
                        [icon]="euroIcon"
                        class="euroIcon">
                </fa-icon>
              </div>
           </div>
         </div>
      </form>
    </div>
    <div class="modal-footer">
      <button type="button" 
              class="btn btn-default" 
              (click)="closeSprievodkaForm()">
              Zavrieť
      </button>
    </div>
  </div>
