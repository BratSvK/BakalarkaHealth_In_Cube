<div class="view-container">
  <div class="delete-icon">
    <div class="form-row">
      <div class="col-md">
        <h4>Zapísať vyšetrenie</h4>
      </div>
      <div class="col-md">
        <fa-icon 
          [icon]="deleteIcon"
          size="2x"
          class="delete float-right"
          (click)="onLeaveCrateMode()">
      </fa-icon>
      </div>
    </div>
  </div>
    <div class="formular">
        <form 
             [formGroup]="vysetrenieCreateForm" 
             autocomplete="off"
             bg-light>
        <div class="form-row">
            <div class="col-md-6 mb-3">
                <label for="patientName">
                  Meno pacienta
                </label>
                <input type="text" 
                       class="form-control" 
                       id="patientName" 
                       formControlName="patientName">
              </div>
              <div class="col-md-6 mb-3">
                <label for="rodneCislo">
                  Rodné číslo
                </label>
                <input type="text" 
                       class="form-control" 
                       id="rodneCislo" 
                       formControlName="rodneCislo">
              </div>
            </div>
            <div class="form-row" *ngIf="(practitionerTypes$ | async) as typesVysetrenia">
                <div class="col-md-6 mb-3">
                    <label for="typVysetrenia">
                        Typ vyšetrenia
                      </label>
                      <select class="custom-select d-block w-100" 
                        id="idTypVysetrenia" 
                        formControlName="idTypVysetrenia">
                <option [disabled]="true" 
                        [selected]="true" 
                        value="">Vyber...
                </option>
                <option [ngValue]="typeDoc.idTypNavigation.idTyp" 
                        *ngFor="let typeDoc of typesVysetrenia">
                        {{typeDoc.idTypNavigation.nazov}}
                </option>
              </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="vysledok">
                        Výsledok
                      </label>
                      <textarea 
                             class="form-control" 
                             id="vysledok"
                             formControlName="vysledok">
                      </textarea>
                </div>
            </div>
              <div class="form-group">
                <label for="scanAttachment">Priložiť prílohu(scan)</label>
                <input 
                      type="file" 
                      class="form-control-file" 
                      id="scanAttachment"
                      (change)="onFileChange($event)">
              </div>
              <div class="zap-choroba-sub-menu mt-3">
              <accordion>
                <accordion-group 
                                [heading]="chorobaTitle" 
                                #chorobaGroup
                                panelClass="liecbaAccordion">
                    <span 
                         accordion-heading 
                         class="float-right mt-2"
                         [ngClass]="{'expanded': chorobaGroup?.isOpen}">
                        <fa-icon 
                                [icon]="caretIcon"
                                size="2x">
                        </fa-icon>
                      </span>

                      <span 
                        accordion-heading 
                        class="float-left">
                     <fa-icon 
                             [icon]="diagnoseIcon"
                             size="2x">
                     </fa-icon>
                   </span>
                      <div
                          formGroupName="zapChoroba" 
                          class="choroba-menu">
                          <div class="form-row">
                            <div class="col-md-4">
                              <label for="choroba">
                                Diagnostikovaná choroba
                              </label>
                              <div class="search">
                                <input 
                                      type="text"
                                      class="form-control"
                                      id="choroba"
                                      placeholder="vyhľadaj chorobu" 
                                      formControlName="chorobaSearch">
                              </div>
                            </div>
                            <div class="col-md-8">
                              <div 
                                  *ngIf="(chorobaZoznamBySearch$ | async) as choroby" 
                                  class="zoznam-search">
                                  <cdk-virtual-scroll-viewport 
                                        itemSize="50" 
                                        class="example-viewport form-control">
                                        <div 
                                            *cdkVirtualFor="let choroba of choroby" 
                                            class="choroba-item"
                                            (click)="onSelected(choroba)">{{choroba.nazov}}
                                        </div>
                                  </cdk-virtual-scroll-viewport>
                              </div>
                            </div>
                          </div>
                      </div>
                      <div class="form-row">
                        <div class="col-md">
                        <label for="chorobaSelected">
                          Vybraná choroba
                        </label>
                        <div class="search">
                          <input 
                                type="text"
                                class="form-control"
                                id="choroba"
                                placeholder="vyhľadaj chorobu" 
                                [value]="selectedChoroba">
                      </div>
                      </div>
                    </div>
                </accordion-group>
            </accordion>
          </div>

          <div class="zap-liebcu-sub-menu">
            <accordion>
              <accordion-group 
                              [heading]="liecbaTitle" 
                              #liecbaGroup
                              panelClass="liecbaAccordion">
                  <span 
                       accordion-heading 
                       class="float-right mt-2"
                       [ngClass]="{'expanded': liecbaGroup?.isOpen}">
                      <fa-icon 
                              [icon]="caretIcon"
                              size="2x">
                      </fa-icon>
                    </span>
                  <span 
                    accordion-heading 
                    class="float-left">
                 <fa-icon 
                         [icon]="proceduresIcon"
                         size="2x">
                 </fa-icon>
               </span>
              </accordion-group>
          </accordion>
        </div>

        <div class="zap-recept-sub-menu">
          <accordion>
            <accordion-group 
                            [heading]="receptTitle" 
                            #receptGroup
                            panelClass="liecbaAccordion">
                <span 
                     accordion-heading 
                     class="float-right mt-2"
                     [ngClass]="{'expanded': receptGroup?.isOpen}">
                    <fa-icon 
                            [icon]="caretIcon"
                            size="2x">
                    </fa-icon>
                  </span>
                <span 
                  accordion-heading 
                  class="float-left">
               <fa-icon 
                       [icon]="recipeIcon"
                       size="2x">
               </fa-icon>
             </span>
            </accordion-group>
        </accordion>
      </div>
              <div class="detail-footer">
                <div class="top-gradient"></div>
                <div class="form-confirmation">
                    <button *ifAuthorizedTo="'practitioner'"
                            class="btn btn-primary btn-save"
                            type="button"
                            [disabled]="vysetrenieCreateForm.disabled"
                            (click)="createVystrenie()">
                        <div class="save-btn">
                            <div class="save-btn-portal">
                                <fa-icon [icon]="pen"></fa-icon>
                            </div>
                            <div class="save-text">Ulož</div>
                        </div>
                    </button>
                </div>
            </div>
    </form>
    </div>
</div>
