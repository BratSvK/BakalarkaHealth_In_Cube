<div class="view-container">
    <app-health-record-vysetrenia-item
        [vysetrenieData]="{ isHeaderClicked: false, vysetrenie: vysetrenie }"
        (isClicked)="isClicked.emit(-1)">
    </app-health-record-vysetrenia-item>
    <div class="formular">
        <form 
        [formGroup]="vysetrenieForm" 
        autocomplete="off"
        bg-light>
        <div class="form-row">
            <div class="col-md-6 mb-3 pt-4">
                <label for="doctorExamination">
                  Meno doktora
                </label>
                <input type="text" 
                       class="form-control" 
                       id="doctorExamination" 
                       formControlName="doctorExamination">
              </div>
              <div class="col-md-6 mb-3 pt-4">
                <label for="dateExamination">
                  Dátum vyšetrenia
                </label>
                <input type="text" 
                       class="form-control" 
                       id="dateExamination" 
                       formControlName="dateExamination">
              </div>
            </div>
            <div class="form-row">
                <div class="col-md-6 mb-3">
                    <label for="typVysetrenia">
                        Typ vyšetrenia
                      </label>
                      <input
                             type="text" 
                             class="form-control" 
                             id="typVysetrenia"
                             formControlName="typVysetrenia">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="vysledok">
                        Výsledok
                      </label>
                      <textarea 
                             class="form-control" 
                             id="vysledok"
                             formControlName="vysledok">
                            </textarea>
                </div>
            </div>
    </form>
    </div>
</div>
