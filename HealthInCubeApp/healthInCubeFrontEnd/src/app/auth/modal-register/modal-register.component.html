<div class="modal-content">
    
    <div class="modal-header">
        <h4 class="modal-title pull-left">
            {{title}}
          </h4>
        <button 
                type="button" 
                class="btn-close close pull-right" 
                aria-label="Close" 
                (click)="bsModalRef.hide()">
            <span 
                 aria-hidden="true" 
                 class="visually-hidden">
                 &times;
            </span>
        </button>
    </div>
    <div class="row no-gutters">
        <div class="col-md-6 d-flex">
                <div class="card-image-wrapper">
                    <img [src]="'../../assets/doctorModal.png'" 
                         alt="lekarModal" 
                         class="card-img-top"
                         (click)="openLekarRegister(true)" />
             </div>
        </div>
        <div class="col-md-6 d-flex">
            <div class="card-image-wrapper">
                <img [src]="'../../assets/patientModal.png'" 
                     alt="patientModal" 
                     class="card-img-top"
                     (click)="openLekarRegister(false)" />
         </div>
        </div>
    </div>
</div>
