<div *ngIf="(typeOfDoctors$ | async) as doctorTypes" >
    <div *ngIf="(pracovnaDobaZoznamDni$ | async) as zoznamDni" >
<div class="container mt-5 registerWrapper text-left">
    <div ngAnimatedBorderWrapper>
        <span ngAnimatedBorder class="myCssAnimation" [abBorderWidth]="['4px']" [abBorderRadius]="['10px']"
            [abBackgroundColor]="'#f5f5f5'">

            <form [formGroup]="registerForm" autocomplete="off" bg-light (ngSubmit)="onSubmit()">

                <div class="d-flex rightCorner justify-content-end">
                    <button class="btn btn-warning" type="button" (click)="onReturn()">Return to login</button>
                </div>

                <h4 class="mb-3 text-uppercase"><i class="fa fa-user mr-2"></i>Užívateľské konto</h4>
                <div formGroupName="userData">
                    <div class="form-row">
                        <div class="col-md-4 mb-3">
                            <label for="firstName">Meno*</label>
                            <input type="text"   #autofocus class="form-control" id="firstName" formControlName="firstName">
                            <!-- <div class="invalid-feedback">
                            Valid first name is required.
                        </div> -->
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="lastName">Priezvisko*</label>
                            <input type="text" class="form-control" id="lastName" formControlName="lastName">
                            <!-- <div class="invalid-feedback">
                            Valid last name is required.
                        </div> -->
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="familyName">Rodné prievzisko<span class="text-muted">(Voľitelné)</span></label>
                            <input type="text" class="form-control" id="familyName" formControlName="familyName">
                            <!-- <div class="invalid-feedback">
                            Valid last name is required.
                        </div> -->
                        </div>
                    </div>
                    <div class="form-row" style="align-items: center;">
                        <div class="col-md-4 mb-3">
                            <label for="BID">Rodné číslo</label>
                            <input 
                                type="text" 
                                class="form-control" 
                                id="BID" 
                                placeholder="etc. 981124/4168"
                                formControlName="birthIDNumber">
                        </div>
                        <div class="col-md-2 mt-4 pl-4" *ngFor="let gender of genders">
                            <div class="radio">
                                <label>
                                    <input type="radio" class="form-check-input" formControlName="gender"
                                        [value]="gender">{{ gender === 'M' ? 'Muž' : 'Žena' }}
                                </label>

                            </div>
                            <!-- <div class="invalid-feedback">
                            Valid first name is required.
                        </div> -->
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="birthDate">Dátum narodenia*</label>
                            <input type="date" class="form-control" id="birthDate" formControlName="birthDate">
                            <!-- <div class="invalid-feedback">
                            Valid last name is required.
                        </div> -->

                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email">Emailová adresa*</label>
                        <input type="email" class="form-control" id="email" placeholder="martin@gmail.com"
                            formControlName="email">
                        <!-- <div class="invalid-feedback">
                        Please enter a valid email address.
                    </div> -->
                    </div>
                    <div class="mb-3">
                        <label for="phone">Telefónne číslo<span class="text-muted">(Voľitelné)</span></label>
                        <input type="text" class="form-control" id="phone" placeholder="421904362907"
                            formControlName="phoneNumber">
                        <div [ngStyle]="{'display': registerForm.get('userData.phoneNumber').invalid ? 'inherit' : 'none' }" class="invalid-feedback">
                        Maximálne 12 znakov(bez +).
                    </div>
                    </div>

                    <div class="form-row mb-3">
                        <div class="col-md">
                        <label for="password">Heslo*</label>
                        <input type="text" class="form-control" id="password" placeholder="SilneHeslo1"
                            formControlName="password">
                        </div>
                        <div class="col-md">
                            <label for="confirmPassword">Zopakuj heslo*</label>
                            <input type="text" class="form-control" id="confirmPassword" placeholder="SilneHeslo1"
                                formControlName="confirmPassword">
                            </div>
                    </div>
                </div>

                <div formGroupName="userAddress">
                    
                    <h4 class="mb-3 text-uppercase"><i class="fa fa-address-book mr-2"></i>ADRESA BYDLISKA</h4>

                    <div class="form-row">
                        <div class="col-md-4 mb-3">
                            <label for="country">Štát*</label>
                            <select class="custom-select d-block w-100" id="country" formControlName="country" (ngModelChange)="onCountryChange()">
                                <option [selected]="true" [ngValue]="">Choose...</option>
                                <option >Slovensko</option>
                            </select>
                            <!-- <div class="invalid-feedback">
                            Please select a valid country.
                        </div> -->
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="district">Okres*</label>
                            <select class="custom-select d-block w-100" id="district" formControlName="district"
                                (ngModelChange)="onChangeOkres()">
                                <option [disabled]="true" [selected]="true" value="">Choose...</option>
                                <option [ngValue]="district.idOkres" *ngFor="let district of okresy">{{district.nazov}}
                                </option>
                            </select>
                            <!-- <div class="invalid-feedback">
                            Please provide a valid state.
                        </div> -->
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="city">Mesto*</label>
                            <select class="custom-select d-block w-100" id="city" formControlName="city">
                                <option [disabled]="true" [selected]="true" value="">Choose...</option>
                                <option [ngValue]="mesto.idMesto" *ngFor="let mesto of mesta">{{mesto.nazov}}</option>
                            </select>
                            <!-- <div class="invalid-feedback">
                            Please provide a valid state.
                        </div> -->
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="street">Ulica*</label>
                        <input type="text" class="form-control" id="street" placeholder="1234 Hlavná Ulica"
                            formControlName="street">
                        <!-- <div class="invalid-feedback">
                        Please enter your street address.
                    </div> -->
                    </div>
                    <div class="custom-control custom-checkbox">
                        <input type="checkbox" class="custom-control-input" id="same-address"
                            formControlName="isPernamentAddress">
                        <label class="custom-control-label" for="same-address">Trvalé bydlisko</label>
                    </div>
                </div>

                <hr class="mb-4">

                <div formGroupName="birthPlace">

                    <hr class="mb-4">

                    <h4 class="mb-3 text-uppercase"><fa-icon class="mr-2"  [icon]="babyIcon"></fa-icon>Miesto narodenia</h4>

                    <div class="form-row">
                        <div class="col-md-4 mb-3">
                            <label for="countryBirth">Štát*</label>
                            <select class="custom-select d-block w-100" id="countryBirth" formControlName="countryBirth" (ngModelChange)="onCountryBirthChange()">
                                <option [selected]="true" [ngValue]="">Choose...</option>
                                <option >Slovensko</option>
                            </select>
                            <!-- <div class="invalid-feedback">
                            Please select a valid country.
                        </div> -->
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="districtBirth">Okres*</label>
                            <select class="custom-select d-block w-100" id="districtBirth" formControlName="districtBirth"
                                (ngModelChange)="onChangeBirthOkres()">
                                <option [disabled]="true" [selected]="true" value="">Choose...</option>
                                <option [ngValue]="district.idOkres" *ngFor="let district of okresyBirth">{{district.nazov}}
                                </option>
                            </select>
                            <!-- <div class="invalid-feedback">
                            Please provide a valid state.
                        </div> -->
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="cityBirth">Mesto*</label>
                            <select class="custom-select d-block w-100" id="cityBirth" formControlName="cityBirth">
                                <option [disabled]="true" [selected]="true" value="">Choose...</option>
                                <option [ngValue]="mesto.idMesto" *ngFor="let mesto of mestaBirth">{{mesto.nazov}}</option>
                            </select>
                            <!-- <div class="invalid-feedback">
                            Please provide a valid state.
                        </div> -->
                        </div>
                    </div>
                </div>
                
                <hr class="mb-4">
                <h4 class="mb-3 text-uppercase">
                    <i class="fa fa-user mr-2"></i>
                    Lekárske data
                </h4>
                <div formGroupName="lekarData">
                    <div class="form-row">
                        <div class="col-md-6 mb-3">
                            <label for="nemocnica">Nemocnica</label>
                            <select 
                                    class="custom-select d-block w-100 ellipsis" 
                                    id="nemocnica" 
                                    formControlName="idNemocnica"
                                    (ngModelChange)="onChangeNemocnica()">
                                <option 
                                        [disabled]="true" 
                                        [selected]="true" 
                                        value="">
                                        Choose...
                                </option>
                                <option 
                                       [ngValue]="nemocnica.idNem" 
                                       *ngFor="let nemocnica of nemocnice">
                                       {{nemocnica.nazov}}
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="nemocnica">Oddelenie</label>
                            <select 
                                class="custom-select d-block w-100 ellipsis" 
                                id="oddelenie" 
                                formControlName="idOddelenie">
                                <option 
                                    [disabled]="true" 
                                    [selected]="true" 
                                    value="">
                                    Choose...
                                </option>
                                <option 
                                    [ngValue]="oddelenie.idOddel" 
                                    *ngFor="let oddelenie of oddelenia">
                                    {{oddelenie.nazovOdd}}
                                </option>
                            </select>
                        </div>
                    </div>
                   
                        <div class="form-row">
                        <div class="col-md mb-3">
                            <label for="dlzkaVysetrenia">Dĺžka vyšetrenia (minúty-odhad)</label>
                            <input 
                                    type="number" 
                                    #autofocus 
                                    class="form-control" 
                                    id="dlzkaVysetrenia" 
                                    formControlName="dlzkaVysetrenia"
                                    step="15"
                                    min="0"
                                    max="120">
                        </div>
                    </div>
                    <h4>Atestacie</h4>
                    <div class="form-row mb-4">
                        <div class="col-md-12"
                            formArrayName="atestacieLekar">
                            <div 
                                class="form-row mr-2 mt-2"
                                *ngFor="let atestaciaDoctor of atestacieLekar; let i = index"
                                [formGroupName]="i"
                                >
                                <div class="col-md-8">
                                    <select class="custom-select d-block w-100" 
                                          id="idTypDoctor" 
                                          formControlName="idTyp"
                                          (ngModelChange)="onSelectAtestaciaType(i)">
                                    <option [disabled]="true" 
                                            [selected]="true" 
                                            value="">Vyber atestáciu...
                                    </option>
                                    <option [ngValue]="typeDoc.idTyp" 
                                            *ngFor="let typeDoc of doctorTypes">
                                            {{typeDoc.nazov}}
                                    </option>
                                  </select>
                                </div>
                                <div class="col-md-2">
                                    <input 
                                        type="number" 
                                        class="form-control"
                                        formControlName="idTypSelected"
                                        min="0">
                                </div>
                                <div class="col-md-2">
                                    <button 
                                        type="button" 
                                        class="btn btn-danger float-right"
                                        (click)="onDeleteAtestacia(i)">
                                        X
                                </button>
                                </div>
                            </div>
                         </div>
                    </div>
                <div class="form-row mb-4">
                    <div class="col-md-12">
                        <button
                            type="button"
                            class="btn btn-success"
                            (click)="onAddAtestacia()">Pridaj atestáciu</button>
                    </div>
                </div>
                <h4>Pracovná doba</h4>
                <div class="form-row mt-4">
                    <div class="col-md-12">
                        <div class="form-row mr-2">
                            <div class="col-md-3">
                                <label for="idDenPracDobaDen">Pracovný deň</label>
                            </div>
                            <div class="col-md-3 time">
                                <label for="idDenPracDobaOd">Začiatok</label>
                            </div>
                            <div class="col-md-3 time">
                                <label for="idDenPracDobaDo">Koniec</label>
                            </div>
                            <div class="col-md-3 time">
                                <label for="idDenPracDobaObed">Obed začiatok</label>
                            </div>
                        </div>
                     </div>
                    </div>
                    <div class="form-row ">
                        <div class="col-md-12"
                             formArrayName="pracovnaDobaZoznam">
                            <div 
                                class="form-row workingday mr-2 mt-2"
                                *ngFor="let pracDoba of pracovnaDoba; let i = index"
                                [formGroupName]="i"
                                >
                                <div class="col-md-3">
                                    <select class="custom-select d-block w-100" 
                                          id="idDenPracDobaDen" 
                                          formControlName="idDen"
                                          (ngModelChange)="onAddPracovnaDoba()">
                                    <option [disabled]="true" 
                                            [selected]="true" 
                                            value="">Vyber den...
                                    </option>
                                    <option [ngValue]="den.idDen" 
                                            *ngFor="let den of zoznamDni">
                                            {{den.nazov}}
                                    </option>
                                  </select>
                                </div>
                                <div class="col-md od">
                                    <timepicker
                                        #timepicker
                                        id="idDenPracDobaOd"  
                                        formControlName="pracDobaOd">
                                    </timepicker>
                                </div>
                                <div class="col-md do">
                                    <timepicker 
                                        #timepicker
                                        id="idDenPracDobaDo"  
                                        formControlName="pracDobaDo">
                                    </timepicker>
                                </div>
                                <div class="col-md obed">
                                    <timepicker
                                        id="idDenPracDobaObed" 
                                        formControlName="obedOd">
                                    </timepicker>
                                </div>
                                <div class="col-md">
                                    <button 
                                        type="button" 
                                        class="btn btn-danger float-right"
                                        (click)="onDeletePracovnaDoba(i)">
                                        X
                                </button>
                                </div>
                            </div>
                         </div>
                        </div>
                </div>
                <hr class="mt-4">
                <p class="text-muted">*(Povinné)</p>
                <button class="btn btn-primary btn-lg btn-block" type="submit" [disabled]="registerForm.invalid">Vytvor</button>
                <div class="invalid-feedback" [ngStyle]="{'display': registerForm.invalid ? 'inherit' : 'none' }">
                    <span class="errorHlaska">Prosím zadaj správne dáta</span>
                </div>
            </form>
        </span>
    </div>
</div>
</div>
</div>
