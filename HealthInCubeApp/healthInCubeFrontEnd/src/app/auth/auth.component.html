<div class="my-container">
    <div class="login-form bgImageWrapper">
        <div class="form-signin ">
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <img src="../../assets/logo.png" alt="logo">
                <h1 class="h3 mb-3 text-muted">Prihlásenie</h1>
                <label for="inputEmail" class="sr-only">Email address</label>
                <input type="email" id="inputEmail" class="form-control" placeholder="Email address" formControlName="email">
                <label for="inputPassword" class="sr-only">Password</label>
                <input type="password" id="inputPassword" class="form-control" placeholder="Password" formControlName="password">
                <!-- <div class="checkbox mb-3">
          <label>
            <input type="checkbox" value="remember-me"> Remember me
          </label>
        </div> -->
                <div class="my-2">
                    <a class="nav-link text-danger" (click)="openChooseRegisterTypeAccount()">Vytvoriť účet</a>
                </div>
                <button class="btn btn-lg btn-primary btn-block" type="submit" [disabled]="!this.loginForm.valid">Prihlásenie</button>
                <div class="my-2">
                    <a href="#" >Zabudnuté heslo</a>
                </div>
            </form>
        </div>
    </div>
</div>
