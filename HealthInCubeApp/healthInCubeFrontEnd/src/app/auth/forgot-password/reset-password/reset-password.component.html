    <div class="login">
        <mat-card class="example-card" style="text-align: center;">
            <h1>Nastav si nové heslo</h1>
            <mat-card-content>
                <form class="example-form" [formGroup]="resetPasswordForm" (keydown.enter)="$event.preventDefault()">
                    <!-- Value: {{myForm.value| json}}-->
                    <div class="textPage">Pouzi jedno veľke, jedno malé písmeno
                        <br>a aspoň jendo číslo(min. 8 znakov)</div>
                    <br>
                    <mat-form-field appearance="fill" class="example-full-width">
                        <input matInput [type]="hide ? 'password' : 'text'" placeholder="Password" type="password" name="password" formControlName="password1" required (keydown.enter)="$event.preventDefault()">

                        <button mat-button *ngIf="password1" matSuffix mat-icon-button aria-label="Clear" (click)="password1=''" mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
                <mat-icon >{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
              </button>
                    </mat-form-field>

                    <mat-form-field appearance="fill" class="example-full-width">
                        <input matInput [type]="hide ? 'password' : 'text'" placeholder="Repeat password" type="password" name="password" formControlName="password2" required (keydown.enter)="$event.preventDefault()">
                        <button mat-button *ngIf="password2" matSuffix mat-icon-button aria-label="Clear" (click)="password2=''" mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
                <mat-icon >{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                  </button>
                    </mat-form-field>

                    <button mat-raised-button [disabled]="resetPasswordForm.invalid || password1!=password2" (click)="resetPassword()" type="Set password" color="warn">Set password</button>
                </form>
            </mat-card-content>
        </mat-card>
    </div>
