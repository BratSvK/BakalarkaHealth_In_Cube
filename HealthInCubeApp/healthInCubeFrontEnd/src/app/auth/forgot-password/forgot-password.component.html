
    <div class="login">
        <mat-card 
                    class="example-card" 
                    style="text-align: center;">
            <br>
            <h1>Žiadosť o zmenu hesla</h1>
            <mat-card-content>
                <form 
                     class="example-form" 
                     [formGroup]="myForm" 
                     (keydown.enter)="$event.preventDefault()">
                    <div class="textPage">Vlož tvoju existujúcu adresu,
                        <br>ktorú si zadal pri registrácií</div>
                    <br>
                    <br>
                    <br>
                    <mat-form-field 
                                    appearance="fill" 
                                    class="example-full-width">
                        <input 
                              id="input"
                              matInput 
                              type="email" 
                              placeholder="jankoHrasko@gmail.com" 
                              formControlName="emailValue" 
                              aria-label="enter email"
                              required>
                        <mat-error *ngIf="!emailValue.valid">
                            Tvoj email nevyzerá dobre.
                        </mat-error>
                        <mat-error *ngIf="emailValue.untouched">
                            Email je <strong>povinný</strong>
                        </mat-error>
                    </mat-form-field>
                    <br>
                    <br>
                    <button 
                            class="button" 
                            mat-raised-button 
                            [disabled]="myForm.invalid"
                            (click)="resetPassword()" 
                            type="submit" 
                            color="warn">
                             Poslať žiadosť
                        </button>
                    <br>
                    <br>
                    <a 
                        [routerLink]="['../']" 
                        routerLinkActive="active-link">
                        Vrátiť sa na prihlásenie
                    </a>
                </form>
            </mat-card-content>
        </mat-card>
    </div>
