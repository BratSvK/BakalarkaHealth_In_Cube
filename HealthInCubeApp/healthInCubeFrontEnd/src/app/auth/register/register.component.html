<div class="container mt-5 registerWrapper text-left">

    <div ngAnimatedBorderWrapper>
        <span ngAnimatedBorder class="myCssAnimation" [abBorderWidth]="['4px']" [abBorderRadius]="['10px']"
            [abBackgroundColor]="'#f5f5f5'">

            <form [formGroup]="registerForm" autocomplete="off" bg-light (ngSubmit)="onSubmit()">

                <div class="d-flex rightCorner justify-content-end">
                    <button class="btn btn-warning" type="button" (click)="onReturn()">Return to login</button>
                </div>

                <h4 class="mb-3 text-uppercase"><i class="fa fa-user mr-2"></i>Create an account </h4>
                <div formGroupName="userData">
                    <div class="form-row">
                        <div class="col-md-4 mb-3">
                            <label for="firstName">First name*</label>
                            <input type="text" class="form-control" id="firstName" formControlName="firstName">
                            <!-- <div class="invalid-feedback">
                            Valid first name is required.
                        </div> -->
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="lastName">Last name*</label>
                            <input type="text" class="form-control" id="lastName" formControlName="lastName">
                            <!-- <div class="invalid-feedback">
                            Valid last name is required.
                        </div> -->
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="familyName">Family name<span class="text-muted">(Optional)</span></label>
                            <input type="text" class="form-control" id="familyName" formControlName="familyName">
                            <!-- <div class="invalid-feedback">
                            Valid last name is required.
                        </div> -->
                        </div>
                    </div>
                    <div class="form-row" style="align-items: center;">
                        <div class="col-md-4 mb-3">
                            <label for="BID">Birth Identifictaion Number</label>
                            <input type="text" class="form-control" id="BID" placeholder="etc. 981124/4168"
                                formControlName="birthIDNumber">
                            <div
                                *ngIf="this.registerForm.get('userData.birthIDNumber')?.touched && this.registerForm.get('userData.birthIDNumber')?.value != null && this.registerForm.get('userData.birthIDNumber')?.value !== '' &&   !this.registerForm.get('userData.birthIDNumber')?.errors; then calculate">
                            </div>
                            <!-- <div class="invalid-feedback">
                            Valid first name is required.
                        </div> -->
                            <ng-template #calculate>
                                <div class="col-md mt-3">
                                    <button class="btn btn-info" (click)="onCalculateFromBIDToBirthDate()">Calculate
                                        date</button>
                                </div>
                            </ng-template>


                        </div>
                        <div class="col-md-2 mt-4 pl-4" *ngFor="let gender of genders">
                            <div class="radio">
                                <label>
                                    <input type="radio" class="form-check-input" formControlName="gender"
                                        [value]="gender">{{ gender === 'M' ? 'Male' : 'Female' }}
                                </label>

                            </div>
                            <!-- <div class="invalid-feedback">
                            Valid first name is required.
                        </div> -->
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="birthDate">Birth Date*</label>
                            <input type="date" class="form-control" id="lastName" formControlName="birthDate">
                            <!-- <div class="invalid-feedback">
                            Valid last name is required.
                        </div> -->

                        </div>
                    </div>



                    <div class="mb-3">
                        <label for="email">Email* <span class="text-muted">(Optional)</span></label>
                        <input type="email" class="form-control" id="email" placeholder="you@example.com"
                            formControlName="email">
                        <!-- <div class="invalid-feedback">
                        Please enter a valid email address.
                    </div> -->
                    </div>
                    <div class="mb-3">
                        <label for="phone">Phone number <span class="text-muted">(Optional)</span></label>
                        <input type="text" class="form-control" id="phone" placeholder="421904362907"
                            formControlName="phoneNumber">
                        <!-- <div class="invalid-feedback">
                        Please enter a valid email phonenumber.
                    </div> -->
                    </div>
                </div>

                <div formGroupName="userAddress">

                    <hr class="mb-4">

                    <h4 class="mb-3 text-uppercase"><i class="fa fa-address-book mr-2"></i>Add an address</h4>

                    <div class="form-row">
                        <div class="col-md-4 mb-3">
                            <label for="country">Country*</label>
                            <select class="custom-select d-block w-100" id="country" formControlName="country" (ngModelChange)="onCountryChange()">
                                <option [selected]="true" [ngValue]="">Choose...</option>
                                <option >Slovakia</option>
                            </select>
                            <!-- <div class="invalid-feedback">
                            Please select a valid country.
                        </div> -->
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="district">District*</label>
                            <select class="custom-select d-block w-100" id="district" formControlName="district"
                                (ngModelChange)="onChangeOkres()">
                                <option [disabled]="true" [selected]="true" value="">Choose...</option>
                                <option [ngValue]="district.idOkres" *ngFor="let district of okresy">{{district.nazov}} - {{district.idOkres}}
                                </option>
                            </select>
                            <!-- <div class="invalid-feedback">
                            Please provide a valid state.
                        </div> -->
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="city">City*</label>
                            <select class="custom-select d-block w-100" id="city" formControlName="city" (ngModelChange)="onChangeCity()">
                                <option [disabled]="true" [selected]="true" value="">Choose...</option>
                                <option [ngValue]="mesto.idMesto" *ngFor="let mesto of mesta">{{mesto.nazov}} - {{mesto.idMesto}}</option>
                            </select>
                            <!-- <div class="invalid-feedback">
                            Please provide a valid state.
                        </div> -->
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="street">Street*</label>
                        <input type="text" class="form-control" id="street" placeholder="1234 Main St"
                            formControlName="street">
                        <!-- <div class="invalid-feedback">
                        Please enter your street address.
                    </div> -->
                    </div>
                    <div class="custom-control custom-checkbox">
                        <input type="checkbox" class="custom-control-input" id="same-address"
                            formControlName="isPernamentAddress">
                        <label class="custom-control-label" for="same-address">Pernament address</label>
                    </div>
                </div>

                <hr class="mb-4">

                <div class="row">
                    <div class="col-md-auto">
                        <h4 class="mb-4 text-uppercase"><i class="fa fa-user-md mr-2"></i>Choose general practitioner
                        </h4>
                    </div>
                    <div class="col-md-auto">
                        <span class="badge badge-warning">Send a request!</span>

                    </div>
                </div>
                <div class="form-group">
                    <div class="form-row">
                        <div class="col-md-4">
                            <select  class="form-control form-control-sm " id="practitioner"
                                formControlName="practitioner" (ngModelChange)="onChangePractitioner()">
                                <option [disabled]="true" [selected]="true" [ngValue]="">Choose practitioner</option>
                                <option [ngValue]=""></option>
                                <option [ngValue]="practitioner" *ngFor="let practitioner of practitioners">{{practitioner.fullName}}</option>
                            </select>
                        </div>

                        <div class="col-md-8" *ngIf="chooseLekar">
                            <app-practitioner-info [practitioner]="chooseLekar"></app-practitioner-info>
                        </div>

                    </div>
                </div>



                <hr class="mt-4">

                <p class="text-muted">*(Required)</p>
                <button class="btn btn-primary btn-lg btn-block" type="submit" [disabled]="registerForm.invalid">Create
                    an user</button>

                <div class="invalid-feedback" [ngStyle]="{'display': registerForm.invalid ? 'inherit' : 'none' }">
                    <span class="errorHlaska">Please enter required and valid data!</span>
                </div>
            </form>
        </span>
    </div>
</div>
