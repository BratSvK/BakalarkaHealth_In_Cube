<div *ngIf="practitioner">
    <div class="card border-info  mb-3">
        <div class="row no-gutters">
          <div class="col-md-4">
            <img class="border border-light img-thumbnail" src="{{practitioner.fotka}} || '../../../../assets/user.png'" alt="photoDoctor">
          </div>
          <div class="col-md-8">
            <div class="card-body">
              <h5 class="card-title">{{practitioner.fullName}}</h5>
              <p class="card-text">{{practitioner.nemocnica}}</p>
              <p class="card-text"><span class="font-weight-light">+{{practitioner.mobil || 'not provide'}}</span> </p>
              <p class="card-text"><small class="text-muted">{{practitioner.email}}</small></p>
            </div>
          </div>
        </div>
      </div>
</div>
