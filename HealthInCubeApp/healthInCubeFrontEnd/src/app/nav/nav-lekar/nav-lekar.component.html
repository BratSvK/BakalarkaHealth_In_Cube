<div *ngIf="(loginDoctorId$ | async)">
<nav class="navbar navbar-expand-md navbar-dark bg-primary">
  <div class="container-fluid">
    <div>
      <i class="brand-zone-text" 
         [inlineSVG]="'assets/brand.svg'">
      </i>
    </div>
    <button class="navbar-toggler" 
            type="button" 
            data-bs-toggle="collapse" 
            (click)="isCollapsed = !isCollapsed"
            [attr.aria-expanded]="!isCollapsed" 
            aria-controls="collapseBasic" 
            aria-controls="collapseBasic"
            aria-expanded="false" 
            aria-label="Toggle navigation">
      <span class="navbar-toggler-icon">
      </span>
    </button>
    <span class="space"></span>
    <div class="collapse navbar-collapse" 
         id="collapseBasic" 
         [collapse]="isCollapsed">
      <ul class="nav nav-pills me-auto mb-2 mb-md-0">
        <ng-container>
          <li *accessToGeneralPractioner="true"
              class="nav-item mr-2">
            <a class="nav-link" 
               [routerLink]="['pacienti-list']" 
               routerLinkActive='active'>
              <fa-icon [icon]="users">
              </fa-icon>
              Pacienti
            </a>
          </li>
          <li class="nav-item">
            <div class="dropdown" 
                 dropdown>
              <a class="nav-link arrow" 
                 dropdownToggle 
                 routerLinkActive='active'>
                <fa-icon [icon]="stethoscope">
                </fa-icon>
                 Vyšetrenia 
                <fa-icon class="arrow" 
                         [icon]="arrowDown">
                </fa-icon>
                <div class="dropdown-menu mt-3" 
                    *dropdownMenu>
                  <a class="dropdown-item" 
                     (click)="openSprievodkaModal()">
                     Sprievodka
                    </a>
                  <div class="dropdown-divider"></div>
                  <a class="dropdown-item" 
                     [routerLink]="['vysetrenia']"
                     routerLinkActive='active'>
                     História
                  </a>
                  <ng-container *accessToGeneralPractioner="false">
                  <div class="dropdown-divider"></div>
                  <a class="dropdown-item" 
                     [routerLink]="['calendar']">
                     Plánovač
                  </a>
                </ng-container>
                </div>
              </a>
            </div>
          </li>
          <li *accessToGeneralPractioner="true"
              class="nav-item mr-2">
            <a class="nav-link" 
               [routerLink]="['requests']" 
              routerLinkActive='active'>
              <fa-icon [icon]="userCheck">
              </fa-icon>
              Žiadanky
            </a>
          </li>
        </ng-container>
      </ul>
      <ul class="navbar-nav flex-row flex-wrap ms-md-auto" 
          style="margin-left: auto!important">
        <app-nav-user-toolbox [user]="user"></app-nav-user-toolbox>
      </ul>
    </div>
  </div>
</nav>
</div>
