# Please refer https://aka.ms/HTTPSinContainer on how to setup an https developer certificate for your ASP .NET Core service.

version: '3.4'

services:
  healthincubebackend:
    image: healthincubebackend
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - 5000:5001

  healthincufrontend:
    image: healthincufrontend
    build:
      context: ./healthInCubeFrontEnd
      dockerfile: ./nginx.dockerfile
    ports:
      - 4200:4200
